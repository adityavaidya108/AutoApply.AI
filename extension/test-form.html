<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form - Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        form {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        textarea {
            min-height: 100px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        h1 {
            color: #333;
        }
        .download-btn {
            margin-top: 5px;
            padding: 5px 10px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .download-btn:hover {
            background: #1976D2;
        }
        .download-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>Job Application Form - Test Page</h1>
    <p>This is a test page to verify AutoApply.AI form detection.</p>
    <p><strong>Instructions:</strong> Load the extension, open this page, and check if the form is detected.</p>
    
    <form id="jobApplicationForm">
        <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" placeholder="Enter your first name">
        </div>
        
        <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" placeholder="Enter your last name">
        </div>
        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your.email@example.com">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="(555) 123-4567">
        </div>
        
        <div class="form-group">
            <label for="address">Street Address</label>
            <input type="text" id="address" name="address" placeholder="123 Main Street">
        </div>
        
        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="New York">
        </div>
        
        <div class="form-group">
            <label for="state">State</label>
            <select id="state" name="state">
                <option value="">Select State</option>
                <option value="NY">New York</option>
                <option value="CA">California</option>
                <option value="TX">Texas</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="zipCode">ZIP Code</label>
            <input type="text" id="zipCode" name="zipCode" placeholder="10001">
        </div>
        
        <div class="form-group">
            <label for="resume">Resume / CV</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
            <button type="button" class="download-btn" id="downloadResume" disabled>📥 Download Resume</button>
        </div>
        
        <div class="form-group">
            <label for="coverLetter">Cover Letter</label>
            <input type="file" id="coverLetter" name="coverLetter" accept=".pdf,.doc,.docx">
            <button type="button" class="download-btn" id="downloadCoverLetter" disabled>📥 Download Cover Letter</button>
        </div>
        
        <div class="form-group">
            <label for="linkedIn">LinkedIn Profile URL</label>
            <input type="url" id="linkedIn" name="linkedIn" placeholder="https://linkedin.com/in/yourprofile">
        </div>
        
        <div class="form-group">
            <label for="yearsExperience">Years of Experience</label>
            <input type="number" id="yearsExperience" name="yearsExperience" placeholder="5">
        </div>
        
        <div class="form-group">
            <label for="currentJobTitle">Current Job Title</label>
            <input type="text" id="currentJobTitle" name="currentJobTitle" placeholder="Software Engineer">
        </div>
        
        <div class="form-group">
            <label for="currentCompany">Current Company</label>
            <input type="text" id="currentCompany" name="currentCompany" placeholder="Tech Corp">
        </div>
        
        <div class="form-group">
            <label for="school">School / University</label>
            <input type="text" id="school" name="school" placeholder="University of Example">
        </div>
        
        <div class="form-group">
            <label for="degree">Degree / Major</label>
            <input type="text" id="degree" name="degree" placeholder="Computer Science">
        </div>
        
        <div class="form-group">
            <label for="graduationDate">Graduation Date</label>
            <input type="date" id="graduationDate" name="graduationDate">
        </div>
        
        <div class="form-group">
            <label for="whyWorkHere">Why do you want to work here?</label>
            <textarea id="whyWorkHere" name="whyWorkHere" placeholder="Tell us why you're interested in this position..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="whyYou">Why are you a good fit for this role?</label>
            <textarea id="whyYou" name="whyYou" placeholder="Explain your qualifications and why you're the right candidate..."></textarea>
        </div>
        
        <div class="form-group">
            <label for="salary">Salary Expectation</label>
            <input type="text" id="salary" name="salary" placeholder="$80,000 - $100,000">
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" id="workAuthorization" name="workAuthorization">
                Are you authorized to work in the United States?
            </label>
        </div>
        
        <button type="submit">Submit Application</button>
    </form>
    
    <script>
        // Prevent form submission for testing
        document.getElementById('jobApplicationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Form submission prevented for testing purposes.\n\nCheck the AutoApply.AI extension to see if fields were detected!');
        });

        // Download functionality
        function setupDownload(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);
            
            function updateButton() {
                if (input.files && input.files.length > 0) {
                    button.disabled = false;
                } else {
                    button.disabled = true;
                }
            }
            
            input.addEventListener('change', updateButton);
            button.addEventListener('click', () => {
                if (input.files && input.files.length > 0) {
                    const file = input.files[0];
                    const url = URL.createObjectURL(file);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = file.name;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
            });
            
            // Check periodically for programmatic changes (from extension)
            setInterval(updateButton, 500);
        }

        setupDownload('resume', 'downloadResume');
        setupDownload('coverLetter', 'downloadCoverLetter');
    </script>
</body>
</html>
